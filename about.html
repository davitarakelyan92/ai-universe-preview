<!DOCTYPE html>
<!--
  Password prompt for the AI Universe preview (src/build-preview.mjs).
  Based on StatiCrypt 3.5.4's lib/password_template.html (MIT). Only the styling and markup were changed.
  The 'Remember me' box is ticked by default so one unlock covers every page.
-->
<html lang="en" class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>AI Universe</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
        <style>
            /* AI Universe look: zinc background, white card, Inter, black button */
            @font-face {
                font-family: "Inter";
                src: url("fonts/inter/inter-latin-wght-normal.woff2") format("woff2-variations");
                font-weight: 100 900;
                font-display: swap;
            }
            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; }
            .staticrypt-content {
                min-height: 100%;
                background: #fafafa;
                font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
                color: #27272a;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            .staticrypt-page { width: 100%; max-width: 400px; padding: 12vh 16px 0; margin: auto; box-sizing: border-box; }
            .staticrypt-form {
                background: #ffffff;
                border: 1px solid #e4e4e7;
                border-radius: 16px;
                padding: 36px 32px 32px;
                text-align: center;
                box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.15);
            }
            .staticrypt-logo {
                display: inline-flex; align-items: center; justify-content: center;
                width: 44px; height: 44px; border-radius: 12px; background: #000; margin-bottom: 14px;
            }
            .staticrypt-instructions { margin-bottom: 20px; }
            .staticrypt-instructions .staticrypt-title { font-size: 1.5rem; font-weight: 700; color: #18181b; margin: 0 0 6px; letter-spacing: -0.01em; }
            .staticrypt-instructions p { margin: 0; font-size: 0.875rem; color: #71717a; }
            .staticrypt-hr { display: none; }
            .staticrypt-password-container {
                position: relative; width: 100%; margin: 0 0 14px; box-sizing: border-box;
                border: 1px solid #d4d4d8; border-radius: 8px; background: #fff;
            }
            .staticrypt-password-container:focus-within { border-color: #000; box-shadow: 0 0 0 2px #000; }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent; border: 0; box-sizing: border-box; font: inherit; font-size: 16px;
                outline: 0; padding: 11px 44px 11px 14px; width: 100%; color: #18181b;
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer; height: 18px; width: 18px; opacity: 0.5; padding: 12px;
                position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            }
            label.staticrypt-remember {
                display: flex; align-items: center; gap: 8px; margin: 0 0 16px; font-size: 0.875rem; color: #52525b; cursor: pointer;
            }
            .staticrypt-remember input[type="checkbox"] { width: 16px; height: 16px; accent-color: #000; margin: 0; }
            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%; border: 0; border-radius: 8px; padding: 11px 16px; cursor: pointer;
                background: #000000; color: #fff; font: inherit; font-size: 0.9375rem; font-weight: 600;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover { background: #27272a; }
            .staticrypt-form .staticrypt-decrypt-button:focus-visible { outline: 2px solid #000; outline-offset: 2px; }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; }
            .staticrypt-spinner {
                display: inline-block; width: 2rem; height: 2rem; border: 0.25em solid #a1a1aa;
                border-right-color: transparent; border-radius: 50%; animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
            @media (prefers-reduced-motion: reduce) { .staticrypt-spinner { animation-duration: 2s; } }
        </style>
    </head>

                        <input type="submit" class="staticrypt-decrypt-button" value="Unlock" />
                    </form>
                </div>
            </div>
